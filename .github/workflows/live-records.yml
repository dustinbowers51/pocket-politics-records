name: Refresh official records
on:
  push:
    branches: [main]
    paths: ['worker/**']
  workflow_dispatch:
    inputs:
      backup_slot:
        description: UTC hour start in epoch milliseconds (Cloudflare backup only)
        required: false
        type: string
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: official-data-publication
  cancel-in-progress: false
jobs:
  backup_check:
    if: github.event_name == 'workflow_dispatch' && inputs.backup_slot != ''
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - id: check
        env:
          SLOT: ${{ inputs.backup_slot }}
        shell: python
        run: |
          import json, os, time
          from datetime import datetime
          import subprocess
          slot = int(os.environ["SLOT"])
          now = int(time.time() * 1000)
          eligible = slot % 3600000 == 0 and slot <= now < slot + 3600000
          if eligible:
              manifest = subprocess.check_output([
                  "curl", "-fsS", "--retry", "2", "--max-time", "20",
                  "https://pocket-politics-records.dustinbowers51.workers.dev/manifest.json",
              ])
              stamp = json.loads(manifest)["updatedAt"]
              eligible = datetime.fromisoformat(stamp).timestamp() * 1000 < slot
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("publish=" + str(eligible).lower(), file=output)
  refresh:
    needs: backup_check
    if: >-
      !cancelled() && (needs.backup_check.result == 'skipped' || needs.backup_check.outputs.publish == 'true') &&
      github.event.repository.private == false && vars.LIVE_PUBLICATION_APPROVED == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dustinbowers51/pocket-politics
          ref: ${{ vars.VERIFIED_APP_COMMIT }}
          ssh-key: ${{ secrets.APP_READ_ONLY_DEPLOY_KEY }}
          persist-credentials: false
      - name: Verify reviewed app revision
        env:
          EXPECTED: ${{ vars.VERIFIED_APP_COMMIT }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache/restore@v4
        with:
          path: var/live
          key: national-archive-v1-${{ github.run_id }}
          restore-keys: national-archive-v1-
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test
      - name: Install the PDF text verifier
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Check out the records Worker for this workflow revision
        uses: actions/checkout@v4
        with:
          path: records-host
          persist-credentials: false
      - name: Verify reviewed debate sources with download retries
        run: python3 records-host/ops/official_downloads.py
      - name: Import and verify official sources
        id: import
        shell: python
        run: |
          from pathlib import Path
          from threading import Lock
          import sys
          import time
          from urllib.error import HTTPError
          from urllib.parse import urlsplit
          sys.path.insert(0, str(Path.cwd()))
          sys.path.insert(0, str(Path("records-host/ops").resolve()))
          from official_downloads import install_archive
          install_archive()
          from ingestion.live_job import refresh

          # Shared across all download workers to avoid simultaneous requests to a chamber.
          lock = Lock()
          last = {}
          def pace(event, args):
              if event != 'urllib.Request':
                  return
              host = urlsplit(args[0]).hostname
              if host not in {'www.senate.gov', 'clerk.house.gov'}:
                  return
              with lock:
                  time.sleep(max(0, last.get(host, 0) + 1 - time.monotonic()))
                  last[host] = time.monotonic()
          sys.addaudithook(pace)
          try:
              manifest = refresh(Path('var/live'), Path('var/site'))
          except HTTPError as error:
              print(f'Official source returned {error.code}: {error.url}', flush=True)
              raise
          print(f"Verified {len(manifest['files'])} files.", flush=True)
      - name: Save resumable official-source archive
        if: always() && steps.import.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: var/live
          key: national-archive-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Include completed debate snapshot in hashed metadata
        env:
          DEBATE_QUOTES_ENABLED: ${{ vars.DEBATE_QUOTES_ENABLED }}
        run: python3 records-host/debate/attach.py var/site
      - run: node scripts/round6/check-release.cjs var/site
      - name: Set cache lifetimes and allow read-only cross-origin access
        run: |
          cat >var/site/_headers <<'EOF'
          /*
            Access-Control-Allow-Origin: *
          /manifest.json
            Cache-Control: no-cache
          /objects/*
            Cache-Control: public, max-age=31536000, immutable
          EOF
      - name: Deploy checked static assets to the existing Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          config=records-host/worker/wrangler.json
          output="$RUNNER_TEMP/worker-version.ndjson"
          WRANGLER_OUTPUT_FILE_PATH="$output" npx --yes wrangler@4.165.0 versions upload --config "$config"
          version=$(jq -ers 'map(select(.type == "version-upload")) | last | .version_id | select(type == "string" and test("^[0-9a-f-]{36}$"))' "$output")
          for delay in 0 5 15 30; do
            sleep "$delay"
            if npx --yes wrangler@4.165.0 versions deploy "$version@100%" --yes --config "$config"; then
              exit 0
            fi
          done
          exit 1
      - name: Verify the public manifest matches the checked release
        run: |
          for attempt in {1..12}; do
            if curl -fsS --max-time 20 https://pocket-politics-records.dustinbowers51.workers.dev/manifest.json -o "$RUNNER_TEMP/public-manifest.json" &&
              cmp -s var/site/manifest.json "$RUNNER_TEMP/public-manifest.json"; then
              jq -er '"Published manifest updatedAt=" + .updatedAt + " version=" + .version' "$RUNNER_TEMP/public-manifest.json" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Notify the publication monitor
        env:
          PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        run: |
          if [[ -z "$PING_URL" ]]; then
            echo "::warning::Publication monitor has no ping URL configured."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 10 --retry 3 --output /dev/null "$PING_URL"
